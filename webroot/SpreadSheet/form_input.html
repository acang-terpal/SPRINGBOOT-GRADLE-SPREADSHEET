        <style>
            /* Definisikan variabel lebar dinamis */
            :root {
                --jss-custom-width: 100%;
            }

            /* Paksa semua instance JSS mengikuti variabel ini */
            /* Pukul rata semua jss_content & jss_worksheet di seluruh halaman! */
            .jss_content,
            .jss_worksheet {
                width: var(--jss-global-width) !important;
                max-width: var(--jss-global-width) !important;
                overflow-x: auto !important;
            }

            .jss_content {
                overflow-x: auto;
                max-height: calc(100vh - 250px);
                /* Sesuaikan 150px dengan tinggi toolbar Anda */
                overflow-y: auto;
                position: relative;
            }

            /* Opsional: Biar Header Tabel Tetap Kelihatan di Atas (Sticky Header) */
            .jss_content thead {
                position: sticky;
                top: 0;
                z-index: 2;
                background: #fff;
            }
        </style>
        <style>
            /* Tambahkan .md-card di depannya agar lebih prioritas */
            .md-card .md-card-toolbar.custom-toolbar {
                height: auto !important;
                /* Paksa height jadi auto agar tidak mentok 48px */
                min-height: 80px;
                /* Tinggi minimal yang Anda mau */
                display: flex;
                flex-wrap: wrap;
                align-items: center;
                justify-content: space-between;
                padding: 10px 16px;
            }

            /* Bagian lainnya tetap sama */
            .editor-section {
                flex: 1 1 100%;
                margin-bottom: 8px;
            }

            .action-section {
                display: flex;
                align-items: center;
                gap: 10px;
                flex: 1 1 100%;
                /* Berikan lebar 100% agar bisa diatur posisinya */
                justify-content: flex-end;
                /* Geser konten ke paling kanan */
            }

            /* Mode Desktop */
            @media screen and (min-width: 960px) {
                .custom-toolbar {
                    flex-wrap: nowrap !important;
                    /* Paksa satu baris */
                    display: flex !important;
                }

                .editor-section {
                    flex: 1 !important;
                    /* WAJIB: Ini yang bikin dia memanjang ke tengah */
                    margin-bottom: 0 !important;
                    margin-right: 20px;
                    /* Jarak aman dengan tombol di kanan */
                    min-width: 0;
                    /* Tambahkan ini supaya input tidak 'meledak' keluar */
                }

                .action-section {
                    flex: 0 0 auto !important;
                    /* Biarkan tombol kanan selebar kontennya saja */
                }
            }
        </style>

        <script>
            // Polyfill to integrate jspreadsheet and jquery
            if (typeof(jQuery) !== 'undefined') {
                (function($) {
                    $.fn.jspreadsheet = $.fn.jexcel = function(mixed) {
                        let container = $(this).get(0);
                        if (!container.jspreadsheet) {
                            return jspreadsheet($(this).get(0), arguments[0]);
                        } else {
                            if (typeof(arguments[0]) == 'number') {
                                let n = arguments[0];
                                let i = 2;
                            } else {
                                let n = 0;
                                let i = 1;
                            }
                            return container.jspreadsheet[n][mixed].apply(
                                container.jspreadsheet[n],
                                Array.prototype.slice.call(arguments, i)
                            );
                        }
                    };
                })(jQuery);
            }
        </script>

        <script>
            $(function () {
                var $switcher = $('#style_switcher'),
                        $switcher_toggle = $('#style_switcher_toggle'),
                        $theme_switcher = $('#theme_switcher'),
                        $mini_sidebar_toggle = $('#style_sidebar_mini'),
                        $slim_sidebar_toggle = $('#style_sidebar_slim'),
                        $boxed_layout_toggle = $('#style_layout_boxed'),
                        $accordion_mode_toggle = $('#accordion_mode_main_menu'),
                        $html = $('html'),
                        $body = $('body');


                $switcher_toggle.click(function (e) {
                    e.preventDefault();
                    $switcher.toggleClass('switcher_active');
                });

                $theme_switcher.children('li').click(function (e) {
                    e.preventDefault();
                    var $this = $(this),
                            this_theme = $this.attr('data-app-theme');

                    $theme_switcher.children('li').removeClass('active_theme');
                    $(this).addClass('active_theme');
                    $html
                            .removeClass('app_theme_a app_theme_b app_theme_c app_theme_d app_theme_e app_theme_f app_theme_g app_theme_h app_theme_i app_theme_dark')
                            .addClass(this_theme);

                    if (this_theme == '') {
                        localStorage.removeItem('altair_theme');
                    } else {
                        localStorage.setItem("altair_theme", this_theme);
                        if (this_theme == 'app_theme_dark') {
                            $('#kendoCSS').attr('href', 'bower_components/kendo-ui/styles/kendo.materialblack.min.css?v=${.now?long}')
                        }
                    }

                });

                // hide style switcher
                $document.on('click keyup', function (e) {
                    if ($switcher.hasClass('switcher_active')) {
                        if (
                                (!$(e.target).closest($switcher).length)
                                || (e.keyCode == 27)
                                ) {
                            $switcher.removeClass('switcher_active');
                        }
                    }
                });

                // get theme from local storage
                if (localStorage.getItem("altair_theme") !== null) {
                    $theme_switcher.children('li[data-app-theme=' + localStorage.getItem("altair_theme") + ']').click();
                }


                // toggle mini sidebar

                // change input's state to checked if mini sidebar is active
                if ((localStorage.getItem("altair_sidebar_mini") !== null && localStorage.getItem("altair_sidebar_mini") == '1') || $body.hasClass('sidebar_mini')) {
                    $mini_sidebar_toggle.iCheck('check');
                }

                $mini_sidebar_toggle
                        .on('ifChecked', function (event) {
                            $switcher.removeClass('switcher_active');
                            localStorage.setItem("altair_sidebar_mini", '1');
                            localStorage.removeItem('altair_sidebar_slim');
                            location.reload(true);
                        })
                        .on('ifUnchecked', function (event) {
                            $switcher.removeClass('switcher_active');
                            localStorage.removeItem('altair_sidebar_mini');
                            location.reload(true);
                        });

                // toggle slim sidebar

                // change input's state to checked if mini sidebar is active
                if ((localStorage.getItem("altair_sidebar_slim") !== null && localStorage.getItem("altair_sidebar_slim") == '1') || $body.hasClass('sidebar_slim')) {
                    $slim_sidebar_toggle.iCheck('check');
                }

                $slim_sidebar_toggle
                        .on('ifChecked', function (event) {
                            $switcher.removeClass('switcher_active');
                            localStorage.setItem("altair_sidebar_slim", '1');
                            localStorage.removeItem('altair_sidebar_mini');
                            location.reload(true);
                        })
                        .on('ifUnchecked', function (event) {
                            $switcher.removeClass('switcher_active');
                            localStorage.removeItem('altair_sidebar_slim');
                            location.reload(true);
                        });

                // toggle boxed layout

                if ((localStorage.getItem("altair_layout") !== null && localStorage.getItem("altair_layout") == 'boxed') || $body.hasClass('boxed_layout')) {
                    $boxed_layout_toggle.iCheck('check');
                    $body.addClass('boxed_layout');
                    $(window).resize();
                }

                $boxed_layout_toggle
                        .on('ifChecked', function (event) {
                            $switcher.removeClass('switcher_active');
                            localStorage.setItem("altair_layout", 'boxed');
                            location.reload(true);
                        })
                        .on('ifUnchecked', function (event) {
                            $switcher.removeClass('switcher_active');
                            localStorage.removeItem('altair_layout');
                            location.reload(true);
                        });

                // main menu accordion mode
                if ($sidebar_main.hasClass('accordion_mode')) {
                    $accordion_mode_toggle.iCheck('check');
                }

                $accordion_mode_toggle
                        .on('ifChecked', function () {
                            $sidebar_main.addClass('accordion_mode');
                        })
                        .on('ifUnchecked', function () {
                            $sidebar_main.removeClass('accordion_mode');
                        });


            });
        </script>
