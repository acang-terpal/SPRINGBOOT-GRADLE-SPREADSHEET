        <script>
            $(function () {
                var $switcher = $('#style_switcher'),
                        $switcher_toggle = $('#style_switcher_toggle'),
                        $theme_switcher = $('#theme_switcher'),
                        $mini_sidebar_toggle = $('#style_sidebar_mini'),
                        $slim_sidebar_toggle = $('#style_sidebar_slim'),
                        $boxed_layout_toggle = $('#style_layout_boxed'),
                        $accordion_mode_toggle = $('#accordion_mode_main_menu'),
                        $html = $('html'),
                        $body = $('body');


                $switcher_toggle.click(function (e) {
                    e.preventDefault();
                    $switcher.toggleClass('switcher_active');
                });

                $theme_switcher.children('li').click(function (e) {
                    e.preventDefault();
                    var $this = $(this),
                            this_theme = $this.attr('data-app-theme');

                    $theme_switcher.children('li').removeClass('active_theme');
                    $(this).addClass('active_theme');
                    $html
                            .removeClass('app_theme_a app_theme_b app_theme_c app_theme_d app_theme_e app_theme_f app_theme_g app_theme_h app_theme_i app_theme_dark')
                            .addClass(this_theme);

                    if (this_theme == '') {
                        localStorage.removeItem('altair_theme');
                    } else {
                        localStorage.setItem("altair_theme", this_theme);
                        if (this_theme == 'app_theme_dark') {
                            $('#kendoCSS').attr('href', 'bower_components/kendo-ui/styles/kendo.materialblack.min.css')
                        }
                    }

                });

                // hide style switcher
                $document.on('click keyup', function (e) {
                    if ($switcher.hasClass('switcher_active')) {
                        if (
                                (!$(e.target).closest($switcher).length)
                                || (e.keyCode == 27)
                                ) {
                            $switcher.removeClass('switcher_active');
                        }
                    }
                });

                // get theme from local storage
                if (localStorage.getItem("altair_theme") !== null) {
                    $theme_switcher.children('li[data-app-theme=' + localStorage.getItem("altair_theme") + ']').click();
                }


                // toggle mini sidebar

                // change input's state to checked if mini sidebar is active
                if ((localStorage.getItem("altair_sidebar_mini") !== null && localStorage.getItem("altair_sidebar_mini") == '1') || $body.hasClass('sidebar_mini')) {
                    $mini_sidebar_toggle.iCheck('check');
                }

                $mini_sidebar_toggle
                        .on('ifChecked', function (event) {
                            $switcher.removeClass('switcher_active');
                            localStorage.setItem("altair_sidebar_mini", '1');
                            localStorage.removeItem('altair_sidebar_slim');
                            location.reload(true);
                        })
                        .on('ifUnchecked', function (event) {
                            $switcher.removeClass('switcher_active');
                            localStorage.removeItem('altair_sidebar_mini');
                            location.reload(true);
                        });

                // toggle slim sidebar

                // change input's state to checked if mini sidebar is active
                if ((localStorage.getItem("altair_sidebar_slim") !== null && localStorage.getItem("altair_sidebar_slim") == '1') || $body.hasClass('sidebar_slim')) {
                    $slim_sidebar_toggle.iCheck('check');
                }

                $slim_sidebar_toggle
                        .on('ifChecked', function (event) {
                            $switcher.removeClass('switcher_active');
                            localStorage.setItem("altair_sidebar_slim", '1');
                            localStorage.removeItem('altair_sidebar_mini');
                            location.reload(true);
                        })
                        .on('ifUnchecked', function (event) {
                            $switcher.removeClass('switcher_active');
                            localStorage.removeItem('altair_sidebar_slim');
                            location.reload(true);
                        });

                // toggle boxed layout

                if ((localStorage.getItem("altair_layout") !== null && localStorage.getItem("altair_layout") == 'boxed') || $body.hasClass('boxed_layout')) {
                    $boxed_layout_toggle.iCheck('check');
                    $body.addClass('boxed_layout');
                    $(window).resize();
                }

                $boxed_layout_toggle
                        .on('ifChecked', function (event) {
                            $switcher.removeClass('switcher_active');
                            localStorage.setItem("altair_layout", 'boxed');
                            location.reload(true);
                        })
                        .on('ifUnchecked', function (event) {
                            $switcher.removeClass('switcher_active');
                            localStorage.removeItem('altair_layout');
                            location.reload(true);
                        });

                // main menu accordion mode
                if ($sidebar_main.hasClass('accordion_mode')) {
                    $accordion_mode_toggle.iCheck('check');
                }

                $accordion_mode_toggle
                        .on('ifChecked', function () {
                            $sidebar_main.addClass('accordion_mode');
                        })
                        .on('ifUnchecked', function () {
                            $sidebar_main.removeClass('accordion_mode');
                        });


            });
        </script>

        <script>
            function sleep(ms) {
                return new Promise(resolve => setTimeout(resolve, ms));
            }

            async function getRate() {
                var token = $("meta[name='_csrf']").attr("content");
                var header = $("meta[name='_csrf_header']").attr("content");
                $.ajax({
                    url: '${webRootUrl}ControllerSpreadSheetHtb/getRate',
                    type: 'POST',
                    async: true,
                    cache: false,
                    data: {
                        "_csrf": token,
                        "testPostParameter" : "testPostValue"
                    },
                    xhrFields: {
                        withCredentials: true
                    },
                    //milisecond timeout
                    timeout: 0,
                    beforeSend: function(xhr) {
                        xhr.setRequestHeader(header, token);
                    },
                    success: function (objRespStr) {
                        var objResp = JSON.parse(objRespStr);
                        console.log(objResp);
                        if(objResp.rc == '00'){
                            var listData = objResp.data;
                            $.each(listData, function (index, val) {
                                $('#upload_' + val.name).html(val.rate_upload);
                                $('#download_' + val.name).html(val.rate_download);
                                $('#total_upload_bytes_' + val.name).html(val.total_upload);
                                $('#total_download_bytes_' + val.name).html(val.total_download);

                                //find low, mid, high rate
                                rateUpload = val.rate_upload.replace('Mbit','');
                                rateDownload = val.rate_download.replace('Mbit','');
                                maxUpload = val.upload_max_limit_at.replace('M','');
                                maxDownload = val.download_max_limit_at.replace('M','');
                                //console.log("maxUpload " + maxUpload);
                                //console.log("maxDownload " + maxDownload);

                                rangeMidUpload = maxUpload / 2;
                                rangeHighUpload = rangeMidUpload / 2;
                                rangeMidDownload = maxDownload / 2;
                                rangeHighDownload = rangeMidDownload / 2;

                                //console.log("rangeMidUpload " + rangeMidUpload);
                                //console.log("rangeHighUpload " + rangeHighUpload);
                                //console.log("rangeMidDownload " + rangeMidDownload);
                                //console.log("rangeHighDownload " + rangeHighDownload);

                                //manipulate upload class
                                if(rateUpload < rangeMidUpload){
                                    $('#upload_' + val.name).removeClass();
                                    $('#upload_' + val.name).addClass("uk-text-success");
                                    $('#upload_' + val.name).attr("style", "color: #286103 !important");
                                } else if(rateUpload > rangeMidUpload && rateUpload < (rangeMidUpload + rangeHighUpload)){
                                    $('#upload_' + val.name).removeClass();
                                    $('#upload_' + val.name).addClass("uk-text-warning");
                                    $('#upload_' + val.name).removeAttr("style");
                                } else {
                                    $('#upload_' + val.name).removeClass();
                                    $('#upload_' + val.name).addClass("uk-text-danger");
                                    $('#upload_' + val.name).removeAttr("style");
                                }
                                //manipulate download class
                                if(rateDownload < rangeMidDownload){
                                    $('#download_' + val.name).removeClass();
                                    $('#download_' + val.name).addClass("uk-text-success");
                                    $('#download_' + val.name).attr("style", "color: #286103 !important");
                                } else if(rateDownload > rangeMidDownload && rateDownload < (rangeMidDownload + rangeHighDownload)){
                                    $('#download_' + val.name).removeClass();
                                    $('#download_' + val.name).addClass("uk-text-warning");
                                    $('#download_' + val.name).removeAttr("style");
                                } else {
                                    $('#download_' + val.name).removeClass();
                                    $('#download_' + val.name).addClass("uk-text-danger");
                                    $('#download_' + val.name).removeAttr("style");
                                }

                            });
                        } else {

                        }
                    },
                    error: function (e) {
                        console.debug(e);
                    },
                    complete: function (e) {
                        // setTimeout(() => {
                        //     getRate();
                        // }, 1000); // 1000 milliseconds = 1 second

                        sleep(100).then(() => {
                            getRate();
                        });
                    }
                });
            }
            sleep(1000).then(() => {
                getRate();
            });
