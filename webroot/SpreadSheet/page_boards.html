<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

    <link rel="icon" type="image/png" href="${webRootUrl}assets/img/favicon-16x16.png" sizes="16x16">
    <link rel="icon" type="image/png" href="${webRootUrl}assets/img/favicon-32x32.png" sizes="32x32">

    <!-- uikit -->

    <!-- style switcher -->

    <!-- altair admin -->

    <!-- themes -->

    <!-- plugin -->
    <link rel="stylesheet" href="${webRootUrl}assets/plugin/imagepicker/image-picker.css" media="all">

    <link href="https://fonts.googleapis.com/css2?family=Material+Icons" rel="stylesheet">

    <!-- matchMedia polyfill for testing media queries in JS -->
    <!--[if lte IE 9]>
        <script type="text/javascript" src="bower_components/matchMedia/matchMedia.js"></script>

        <link rel="stylesheet" href="${webRootUrl}assets/css/ie.css" media="all">

<body class=" sidebar_main_open sidebar_main_swipe">
    <div id="webRootUrl" style="visibility: hidden;">${webRootUrl}</div>

    <!-- main header -->
    ${headerObj}
    <!-- main header end -->

    <!-- main sidebar -->
    ${sideBarObj}

    ${pageContentObj}

    <#if level_id == '1'>
        <div class="md-fab-wrapper">
            <!-- <a class="md-fab md-fab-accent md-fab-wave" href="#new_board" data-uk-modal="{ center:true }"> -->
            <a id="new_board_button" class="md-fab md-fab-accent md-fab-wave">
                <i class="material-icons">&#xE145;</i>
            </a>
        </div>
    </#if>

    <!-- secondary sidebar -->
    ${sideBarSecondaryObj}
    <!-- secondary sidebar end -->

    <!-- google web fonts -->
    <script>
        WebFontConfig = {
            google: {
                families: [
                    'Source+Code+Pro:400,700:latin',
                    'Roboto:400,300,500,700,400italic:latin'
                ]
            }
        };
        (function () {
            var wf = document.createElement('script');
            wf.src = ('https:' == document.location.protocol ? 'https' : 'http') +
                '://ajax.googleapis.com/ajax/libs/webfont/1/webfont.js';
            wf.type = 'text/javascript';
            wf.async = 'true';
            var s = document.getElementsByTagName('script')[0];
            s.parentNode.insertBefore(wf, s);
        })();
    </script>

    <!-- common functions -->
    <script src="${webRootUrl}assets/js/common.min.js"></script>
    <!-- uikit functions -->
    <script src="${webRootUrl}assets/js/uikit_custom.min.js"></script>
    <!-- altair common functions/helpers -->
    <script src="${webRootUrl}assets/js/altair_admin_common.min.js"></script>

    <!-- page specific plugins -->
    <!--  image-picker component functions -->
    <script src="${webRootUrl}assets/plugin/imagepicker/image-picker.js"></script>
    <!--  cards component functions -->
    <script src="${webRootUrl}assets/js/pages/components_cards.min.js"></script>

    <script>
        $(function () {
            if (isHighDensity) {
                // enable hires images
                altair_helpers.retina_images();
            }
            if (Modernizr.touch) {
                // fastClick (touch devices)
                FastClick.attach(document.body);
            }
        });
        $window.load(function () {
            // ie fixes
            altair_helpers.ie_fix();
        });
    </script>

    <!-- style switcher -->
    ${styleSwitcherObj}
    <!-- style switcher end -->
    

    <script>
        $(document).ready(function () {
            ctrlBoards.init();
            ctrlHeader.init();
        });

        var ctrlHeader = {
            init: function(){
                $('#logout').click(function () {
                    UIkit.modal.confirm('Are you sure want to logout?', function () {
                        //ajax archieve
                        var modalLoading = UIkit.modal.blockUI("On Progress Logout"); // modal.hide() to unblock
                        $.ajax({
                            url: $("#webRootUrl").html() + 'ControllerMamenLogin/logout',
                            type: 'POST',
                            async: true,
                            cache: false,
                            data: {},
                            xhrFields: {
                                withCredentials: true
                            },
                            //milisecond timeout
                            timeout: 0,
                            success: function (jObjRespStr) {
                                jObjResp = JSON.parse(jObjRespStr);
                                ctrlBoards.consoleLog(jObjResp);
                                if (jObjResp.rc == '00') {
                                    
                                } else if (jObjResp.rc == '02') {
                                    window.location.href = jObjResp.redirectUrl;
                                } else if (jObjResp.rc == '03') {
                                    UIkit.modal.alert(jObjResp.message);
                                } else {
                                    UIkit.modal.alert("Failed update data, something wrong!");
                                }
                            },
                            error: function (e) {
                                console.debug(e);
                                UIkit.modal.alert("Failed update data, network error!");
                            },
                            complete: function (e) {
                                modalLoading.hide();
                            }
                        });
                    });
                });
            }
        }

        var ctrlBoards = {
            jArrBoardBoardId: null,
            modalBoardUpdate: UIkit.modal("#update_task"),
            modalBoardInsert: UIkit.modal("#new_board"),
            init: function () {
                ctrlBoards.initData();
                ctrlBoards.initBehaviour();
            },
            initData: function () {
                //init collection data
                var rawData = $.trim($("#listBoard").html().replace(/\s/g, ""));
                console.log("data : " + rawData)
                if (rawData != '[]') {
                    var jArrListBoardIdStr = rawData.substring(0, rawData.length - 2) + "]";
                    ctrlBoards.jArrBoardBoardId = JSON.parse(jArrListBoardIdStr);
                }
            },
            addClickListenerEachBoard: function(){
                $.each(ctrlBoards.jArrBoardBoardId, function (index, val) {
                    //add on click listener on edit action each board
                    $('#edit_' + val).click(function () {
                        boardId = $(this).attr('id').replace("edit_", "");
                        dataBoardId = JSON.parse($('#data_' + boardId).html());
                        //modify modal dialog form value
                        $('#board_id_update').html(boardId);
                        $('#board_title_update').val(dataBoardId.title);
                        $('#board_description_update').val(dataBoardId.description);
                        $("#image-selector-update").val(dataBoardId.background).change();
                        $("#image-selector-update").data('picker').sync_picker_with_select();
                        ctrlBoards.modalBoardUpdate.show();
                    });
                    //add click action on archieve
                    $('#archieve_' + val).click(function () {
                        console.log("archieve_" + val);
                        boardId = $(this).attr('id').replace("archieve_", "");
                        dataBoardId = JSON.parse($('#data_' + boardId).html());
                        ctrlBoards.serviceArchieveBoard(dataBoardId.title, boardId);
                    });
                    //add click action on show scrum
                    $('#show_scrum_' + val).click(function () {
                        console.log("show_scrum_" + val);
                        //redirect page to scrum
                        window.location.href = $("#webRootUrl").html() + 'ControllerMamenScrum/getScrum/page_scrum_board_custom?board_id=' + val;
                    });
                });
            },
            removeClickListenerEachBoard: function(){
                $.each(ctrlBoards.jArrBoardBoardId, function (index, val) {
                    //add on click listener on edit action each board
                    $('#edit_' + val).off("click");
                    $('#archieve_' + val).off("click");
                    $('#show_scrum_' + val).off("click");
                });
            },
            initBehaviour: function () {
                //add on click listener
                ctrlBoards.addClickListenerEachBoard();
                //on focus when modal update data show
                $('#update_task').on({
                    'show.uk.modal': function () {
                        $('#board_description_update').focus();
                        $('#board_title_update').focus();
                    },
                    'hide.uk.modal': function () {

                    }
                });
                //confirmation and hit api update data
                $('#board_update').click(function () {
                    UIkit.modal.confirm("Are you sure to update data?", function () {
                        // will be executed on confirm.
                        ctrlBoards.serviceUpdateDataBoard();
                    });
                });
                //add on click listener on insert new action
                $('#new_board_button').click(function () {
                    ctrlBoards.modalBoardInsert.show();
                });
                //confirmation and hit api new data
                $('#new_board_save').click(function () {
                    UIkit.modal.confirm("Are you sure to Save data?", function () {
                        // will be executed on confirm.
                        ctrlBoards.serviceInsertDataBoard();
                    });
                });
                //image picker for update
                $("#image-selector-update").imagepicker();
                console.log($("#image-selector-update").data('picker').selected_values());
                //image picker for insert
                $("#image-selector-insert").imagepicker();
                console.log($("#image-selector-insert").data('picker').selected_values());
            },
            serviceUpdateDataBoard: function () {
                var modalLoading = UIkit.modal.blockUI("On Progress Update"); // modal.hide() to unblock
                $.ajax({
                    url: $("#webRootUrl").html() + 'ControllerMamenBoard/updateBoard',
                    type: 'POST',
                    async: true,
                    cache: false,
                    data: {
                        'board_id': $('#board_id_update').html(),
                        'board_name': $('#board_title_update').val(),
                        'board_description': $('#board_description_update').val(),
                        'board_background': $("#image-selector-update").data('picker').selected_values()[0]
                    },
                    xhrFields: {
                        withCredentials: true
                    },
                    //milisecond timeout
                    timeout: 0,
                    success: function (jObjRespStr) {
                        jObjResp = JSON.parse(jObjRespStr);
                        ctrlBoards.consoleLog(jObjResp);
                        if (jObjResp.rc == '00') {
                            ctrlBoards.modalBoardUpdate.hide();
                            $('#board_name_' + jObjResp.jObjBoard.board_id).html(jObjResp.jObjBoard.board_name);
                            $('#board_description_' + jObjResp.jObjBoard.board_id).html(jObjResp.jObjBoard.board_description);
                            $('#board_background_' + jObjResp.jObjBoard.board_id).attr("src", $("#webRootUrl").html() + "assets/img/gallery/" + jObjResp.jObjBoard.board_background);
                            dataBoard = {
                                id: jObjResp.jObjBoard.board_id,
                                title: jObjResp.jObjBoard.board_name,
                                description: jObjResp.jObjBoard.board_description,
                                background: jObjResp.jObjBoard.board_background
                            };
                            $('#data_' + jObjResp.jObjBoard.board_id).html(JSON.stringify(dataBoard));
                        } else if (jObjResp.rc == '02') {
                            window.location.href = jObjResp.redirectUrl;
                        } else if (jObjResp.rc == '03') {
                            UIkit.modal.alert(jObjResp.message);
                        } else {
                            UIkit.modal.alert("Failed update data, something wrong!");
                        }
                    },
                    error: function (e) {
                        console.debug(e);
                        UIkit.modal.alert("Failed update data, network error!");
                    },
                    complete: function (e) {
                        modalLoading.hide();
                    }
                });
            },
            serviceInsertDataBoard: function () {
                var modalLoading = UIkit.modal.blockUI("On Progress Insert"); // modal.hide() to unblock
                $.ajax({
                    url: $("#webRootUrl").html() + 'ControllerMamenBoard/insertBoard',
                    type: 'POST',
                    async: true,
                    cache: false,
                    data: {
                        'board_name': $('#board_new_title').val(),
                        'board_description': $('#board_new_description').val(),
                        'board_background': $("#image-selector-insert").data('picker').selected_values()[0]
                    },
                    xhrFields: {
                        withCredentials: true
                    },
                    //milisecond timeout
                    timeout: 0,
                    success: function (jObjRespStr) {
                        ctrlBoards.consoleLog(jObjRespStr);
                        jObjResp = JSON.parse(jObjRespStr);
                        if (jObjResp.rc == '00') {
                            ctrlBoards.modalBoardInsert.hide();
                            ctrlBoards.removeClickListenerEachBoard();
                            //add new board to html element
                            boardElement = '<div id="container_'+ jObjResp.jObjBoard.board_id + '"> \
                                    <div id="random_progress" class="md-card md-card-hover">\
                                        <div class="md-card-toolbar" data-toolbar-progress="0" data-toolbar-progress-steps="true">\
                                            <div class="md-card-toolbar-actions">\
                                                <div class="md-card-dropdown" data-uk-dropdown="{pos:\'bottom-right\'}">\
                                                    <i class="md-icon material-icons">&#xE5D4;</i>\
                                                    <div class="uk-dropdown">\
                                                        <ul class="uk-nav">\
                                                            <li class="md-btn-wave" id="edit_'+ jObjResp.jObjBoard.board_id + '">\
                                                                <a><i class="uk-icon-pencil uk-margin-small-right"></i> Edit</a>\
                                                                <div id="data_'+ jObjResp.jObjBoard.board_id + '" style="display: none;">\
                                                                    {"id" : "'+ jObjResp.jObjBoard.board_id + '", \
                                                                    "title" : "' + jObjResp.jObjBoard.board_name + '",\
                                                                    "description" : "' + jObjResp.jObjBoard.board_description + '",\
                                                                    "background" : "' + jObjResp.jObjBoard.board_background + '"}\
                                                                </div>\
                                                            </li>\
                                                            <!--<li class="md-btn-wave" id="edit_group_'+ jObjResp.jObjBoard.board_id + '"><a><i class="uk-icon-group uk-margin-small-right"></i> Member</a></li>-->\
                                                            <li class="md-btn-wave" id="archieve_'+ jObjResp.jObjBoard.board_id + '"><a><i class="uk-icon-archive uk-margin-small-right"></i> Archive</a></li>\
                                                            <li class="md-btn-wave" id="show_scrum_'+ jObjResp.jObjBoard.board_id + '"><a><i class="uk-icon-sliders uk-margin-small-right"></i> Show Scrum</a></li>\
                                                        </ul>\
                                                    </div>\
                                                </div>\
                                            </div>\
                                            <h3 class="md-card-toolbar-heading-text">\
                                                Progress <span id="progress_value">0</span>%\
                                            </h3>\
                                        </div>\
                                        <div class="md-card-content">\
                                            <img id="board_background_'+ jObjResp.jObjBoard.board_id + '" src="' + $("#webRootUrl").html() + 'assets/img/gallery/' + jObjResp.jObjBoard.board_background + '" alt="">\
                                            <div class="uk-margin-small-top">\
                                                <strong id="board_name_'+ jObjResp.jObjBoard.board_id + '">' + jObjResp.jObjBoard.board_name + '</strong><br>\
                                                <span id="board_description_'+ jObjResp.jObjBoard.board_id + '" class="uk-text-muted">' + jObjResp.jObjBoard.board_description + '</span>\
                                            </div>\
                                        </div>\
                                    </div>\
                                </div>'
                            $('#board_list').append(boardElement);
                            ctrlBoards.jArrBoardBoardId.push(jObjResp.jObjBoard.board_id);
                            ctrlBoards.addClickListenerEachBoard();
                            // //add action edit listener
                            // $('#edit_' + jObjResp.jObjBoard.board_id).click(function () {
                            //     dataBoardId = JSON.parse($('#data_' + jObjResp.jObjBoard.board_id).html());
                            //     //modify modal dialog form value
                            //     $('#board_id_update').html(dataBoardId.id);
                            //     $('#board_title_update').val(dataBoardId.title);
                            //     $('#board_description_update').val(dataBoardId.description);
                            //     $("#image-selector-update").val(dataBoardId.background).change();
                            //     $("#image-selector-update").data('picker').sync_picker_with_select();
                            //     ctrlBoards.modalBoardUpdate.show();
                            // });
                            // //add click action on archieve
                            // $('#archieve_' + jObjResp.jObjBoard.board_id).click(function () {
                            //     console.log("archieve_" + jObjResp.jObjBoard.board_id);
                            //     ataBoardId = JSON.parse($('#data_' + jObjResp.jObjBoard.board_id).html());
                            //     ctrlBoards.serviceArchieveBoard(jObjResp.jObjBoard.board_name, jObjResp.jObjBoard.board_id);
                            // });
                            // //add click action on show scrum
                            // $('#show_scrum_' + jObjResp.jObjBoard.board_id).click(function () {
                            //     console.log("show_scrum_" + jObjResp.jObjBoard.board_id);
                            //     //redirect page to scrum
                            //     window.location.href = $("#webRootUrl").html() + 'ControllerMamenScrum/getScrum/page_scrum_board_custom?board_id=' + jObjResp.jObjBoard.board_id;
                            // });
                        } else if (jObjResp.rc == '02') {
                            window.location.href = jObjResp.redirectUrl;
                        } else if (jObjResp.rc == '03') {
                            UIkit.modal.alert(jObjResp.message);
                        } else {
                            UIkit.modal.alert("Failed update data, something wrong!");
                        }
                    },
                    error: function (e) {
                        console.debug(e);
                        UIkit.modal.alert("Failed update data, network error!");
                    },
                    complete: function (e) {
                        modalLoading.hide();
                    }
                });
            },
            serviceArchieveBoard: function (boardName, boardId) {
                UIkit.modal.confirm('Are you sure to archieve board "' + boardName + '"?', function () {
                    //ajax archieve
                    var modalLoading = UIkit.modal.blockUI("On Progress Archieve"); // modal.hide() to unblock
                    $.ajax({
                        url: $("#webRootUrl").html() + 'ControllerMamenBoard/archieveBoard',
                        type: 'POST',
                        async: true,
                        cache: false,
                        data: {
                            'board_id': boardId
                        },
                        xhrFields: {
                            withCredentials: true
                        },
                        //milisecond timeout
                        timeout: 0,
                        success: function (jObjRespStr) {
                            jObjResp = JSON.parse(jObjRespStr);
                            ctrlBoards.consoleLog(jObjResp);
                            if (jObjResp.rc == '00') {
                                ctrlBoards.modalBoardUpdate.hide();
                                //jquery remove board
                                $('#container_' + jObjResp.jObjBoard.board_id).remove();
                            } else if (jObjResp.rc == '02') {
                                window.location.href = jObjResp.redirectUrl;
                            } else if (jObjResp.rc == '03') {
                                UIkit.modal.alert(jObjResp.message);
                            } else {
                                UIkit.modal.alert("Failed update data, something wrong!");
                            }
                        },
                        error: function (e) {
                            console.debug(e);
                            UIkit.modal.alert("Failed update data, network error!");
                        },
                        complete: function (e) {
                            modalLoading.hide();
                        }
                    });
                });
            },
            consoleLog: function (string) {
                console.log(string);
            }
        }
    </script>
</body>

</html>
