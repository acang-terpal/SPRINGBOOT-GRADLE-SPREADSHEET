<!doctype html>
<!--[if lte IE 9]> <html class="lte-ie9" lang="en"> <![endif]-->
<!--[if gt IE 9]><!--> <html lang="en"> <!--<![endif]-->
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <!-- Remove Tap Highlight on Windows Phone IE -->
        <meta name="msapplication-tap-highlight" content="no"/>

        <link rel="icon" type="image/png" href="${webRootUrl}assets/img/favicon-16x16.png" sizes="16x16">
        <link rel="icon" type="image/png" href="${webRootUrl}assets/img/favicon-32x32.png" sizes="32x32">

        <title>Altair Admin v2.7.0 - Login Page</title>

        <link href='https://fonts.googleapis.com/css?family=Roboto:300,400,500' rel='stylesheet' type='text/css'>

        <!-- uikit -->
        <link rel="stylesheet" href="${webRootUrl}bower_components/uikit/css/uikit.almost-flat.min.css"/>

        <!-- altair admin login page -->
        <link rel="stylesheet" href="${webRootUrl}assets/css/login_page.min.css" />

    </head>
    <body class="login_page">

        <div class="login_page_wrapper">
            <div class="md-card" id="login_card">
                <div class="md-card-content large-padding" id="login_form">
                    <form>
                        <div class="uk-form-row">
                            <label for="reset_password">Password</label>
                            <input class="md-input" type="password" id="reset_password" name="reset_password" />
                        </div>
                        <div class="uk-form-row">
                            <label for="reset_password_repeat">Repeat Password</label>
                            <input class="md-input" type="password" id="reset_password_repeat" name="reset_password_repeat" />
                        </div>
                        <div class="uk-margin-medium-top">
                            <a id="reset_button" class="md-btn md-btn-primary md-btn-block md-btn-large">Reset</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- common functions -->
        <script src="${webRootUrl}assets/js/common.min.js"></script>
        <!-- uikit functions -->
        <script src="${webRootUrl}assets/js/uikit_custom.min.js"></script>
        <!-- altair core functions -->
        <script src="${webRootUrl}assets/js/altair_admin_common.min.js"></script>

        <!-- altair login page functions -->
        <script src="${webRootUrl}assets/js/pages/login.js"></script>

        <script>
            // check for theme
            if (typeof (Storage) !== "undefined") {
                var root = document.getElementsByTagName('html')[0],
                        theme = localStorage.getItem("altair_theme");
                if (theme == 'app_theme_dark' || root.classList.contains('app_theme_dark')) {
                    root.className += ' app_theme_dark';
                }
            }

            $(document).ready(function () {
                ctrlReset.init();
            });

            var ctrlReset = {
                jArrBoardColumnId: null,
                init: function () {
                    ctrlReset.initBehaviour();
                },
                initBehaviour: function(){
                    $('#reset_button').click(function () {
                        ctrlReset.reset();
                    });
                },
                getParameterByName: function(name){
                    url = window.location.href;
                    name = name.replace(/[\[\]]/g, "\\$&");
                    var regex = new RegExp("[?&]" + name + "(=([^&#]*)|&|#|$)"),
                        results = regex.exec(url);
                    if (!results) return null;
                    if (!results[2]) return '';
                    return decodeURIComponent(results[2].replace(/\+/g, " "));
                },
                reset: function(){
                    var modalLoading = UIkit.modal.blockUI("On Progress Login"); // modal.hide() to unblock
                    $.ajax({
                        url: '${webRootUrl}ControllerMamenLogin/doReset',
                        type: 'POST',
                        async: true,
                        cache: false,
                        data: {
                            'reset_password': $('#reset_password').val(),
                            'reset_password_repeat': $('#reset_password_repeat').val(),
                            'key': ctrlReset.getParameterByName('key')
                        },
                        xhrFields: {
                            withCredentials: true
                        },
                        //milisecond timeout
                        timeout: 0,
                        success: function (jObjRespStr) {
                            jObjResp = JSON.parse(jObjRespStr);
                            ctrlReset.consoleLog(jObjResp);
                            if(jObjResp.rc == '00'){
                                notify = UIkit.notify({
                                    message : "<i class='uk-icon-check'></i>Success, please login with your new password!",
                                    status  : 'success',
                                    timeout : 5000,
                                    pos     : 'top-center',
                                    onClose: function() {
                                        // clear notify timeout (sometimes callback is fired more than once)
                                        clearTimeout(notify.timeout)
                                        //redirect to login
                                        window.location= "${webRootUrl}ControllerMamenLogin/getLogin/login?tes=bla&ya=tidak";
                                    }
                                });
                            } else {
                                UIkit.modal.alert("Failed login, something wrong!");
                            }
                        },
                        error: function (e) {
                            console.debug(e);
                            UIkit.modal.alert("Failed login, network error!");
                        },
                        complete: function (e) {
                            modalLoading.hide();
                        }
                    });
                },
                consoleLog: function (string) {
                    console.log(string);
                }
            };
        </script>
    </body>
</html>
