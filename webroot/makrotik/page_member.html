<body class=" sidebar_main_open sidebar_main_swipe">

    <div class="md-fab-wrapper">
        <!-- <a class="md-fab md-fab-accent md-fab-wave" href="#new_board" data-uk-modal="{ center:true }"> -->
        <a id="new_member_button" class="md-fab md-fab-accent md-fab-wave">

        </a>
    </div>

    <!-- google web fonts -->
    <script>
        WebFontConfig = {
            google: {
                families: [
                    'Source+Code+Pro:400,700:latin',
                    'Roboto:400,300,500,700,400italic:latin'
                ]
            }
        };

    <!-- common functions -->

    <!-- altair common functions/helpers -->

    <!-- page specific plugins -->

    <script>
        $(function () {
            if (isHighDensity) {
                // enable hires images
                altair_helpers.retina_images();
            }
            if (Modernizr.touch) {
                // fastClick (touch devices)
                FastClick.attach(document.body);
            }
        });
        $window.load(function () {
            // ie fixes
            altair_helpers.ie_fix();
        });
    </script>


    <!-- style switcher -->
    ${styleSwitcherObj}
    <!-- style switcher end -->

    <script>
        $(document).ready(function () {
            ctrlMember.init();
        });

        var ctrlMember = {
            jArrAccountId: [],
            modalMemberInsert: UIkit.modal("#add_member"),
            init: function () {
                ctrlMember.initData();
                ctrlMember.initBehaviour();
            },
            initData: function () {
                //init collection data
                var rawData = $.trim($("#listMember").html().replace(/\s/g, ""));
                if(rawData != '[]'){
                    var jArrListaccountIdStr = rawData.substring(0, rawData.length - 2) + "]";
                    ctrlMember.jArrAccountId = JSON.parse(jArrListaccountIdStr);
                }
            },
            initBehaviour: function () {
                //add on click listener on insert new action
                $('#new_member_button').click(function () {
                    ctrlMember.modalMemberInsert.show();
                });
                //confirmation and hit api new data
                $('#submit_new_member').click(function () {
                    ctrlMember.submitAddMember();
                });
                ctrlMember.addMemberActionListener();
            },
            modifyHtmlDataAccount: function(){
                //jArrMemberStrHtml = $("#listMember").html().replace(/\s/g, "");
                //jArrMemberStrHtml = jArrMemberStrHtml.substring(0, jArrMemberStrHtml.length - 2) + "]";
                //jArrMemberStrHtml = (jArrMemberStrHtml == ']') ? '[]' : jArrMemberStrHtml;

                jArrMemberStrHtml = JSON.stringify(ctrlMember.jArrAccountId);
                $("#listMember").html(jArrMemberStrHtml.substring(0, jArrMemberStrHtml.length - 1) + ",]");
            },
            removeMemberAccountListener: function(){
                $.each(ctrlMember.jArrAccountId, function (index, val) {
                    //add on click listener on edit action each board
                    $('#delete_' + val).off("click");
                    $('#as_admin_' + val).off("click");
                    $('#as_watcher_' + val).off("click");
                    $('#as_member_' + val).off("click");
                });
            },
            addMemberActionListener: function(){
                //add on click listener
                $.each(ctrlMember.jArrAccountId, function (index, val) {
                    //add on click listener on edit action each board
                    $('#delete_' + val).click(function () {
                        accountId = $(this).attr('id').replace("delete_", "");
                        dataAccountId = JSON.parse($('#data_' + accountId).html());
                        console.log(dataAccountId);
                        ctrlMember.submitDeleteMember(dataAccountId);
                    });
                    //add on click listener on edit action each board
                    $('#as_admin_' + val).click(function () {
                        accountId = $(this).attr('id').replace("as_admin_", "");
                        dataAccountId = JSON.parse($('#data_' + accountId).html());
                        console.log(dataAccountId);
                        ctrlMember.submitAsAdmin(dataAccountId);
                    });
                    //add on click listener on edit action each board
                    $('#as_watcher_' + val).click(function () {
                        accountId = $(this).attr('id').replace("as_watcher_", "");
                        dataAccountId = JSON.parse($('#data_' + accountId).html());
                        console.log(dataAccountId);
                        ctrlMember.submitAsWatcher(dataAccountId);
                    });                  
                    $('#as_member_' + val).click(function () {
                        accountId = $(this).attr('id').replace("as_member_", "");
                        dataAccountId = JSON.parse($('#data_' + accountId).html());
                        console.log(dataAccountId);
                        ctrlMember.submitAsMember(dataAccountId);
                    });
                });
            },
            submitAddMember: function () {
                var modalLoading = UIkit.modal.blockUI("On Progress Add Member"); // modal.hide() to unblock
                $.ajax({
                    url: $("#webRootUrl").html() + 'ControllerMamenMember/addMember',
                    type: 'POST',
                    async: true,
                    cache: false,
                    data: {
                        'account_email': $('#account_email').val()
                    },
                    xhrFields: {
                        withCredentials: true
                    },
                    //milisecond timeout
                    timeout: 0,
                    success: function (jObjRespStr) {
                        ctrlMember.consoleLog(jObjRespStr);
                        jObjResp = JSON.parse(jObjRespStr);
                        if (jObjResp.rc == '00') {
                            ctrlMember.modalMemberInsert.hide();
                            ctrlMember.removeMemberAccountListener();
                            ctrlMember.jArrAccountId.push(jObjResp.jObjAccount.account_id);
                            //add new board to html element
                            memberElement = '<li id="container_'+jObjResp.jObjAccount.account_id+'">\
                                <div class="md-card-list-item-menu" data-uk-dropdown="{mode:\'hover\',pos:\'bottom-right\'}">\
                                    <a href="#" class="md-icon material-icons">&#xE5D4;</a>\
                                    <div class="uk-dropdown uk-dropdown-small">\
                                        <ul class="uk-nav">\
                                            <li class="uk-nav-header">Set Role As</li>\
                                            <li><a id="as_admin_'+jObjResp.jObjAccount.account_id+'">Admin</a></li>\
                                            <li><a id="as_watcher_'+jObjResp.jObjAccount.account_id+'">Watcher</a></li>\
                                            <li><a id="as_member_'+jObjResp.jObjAccount.account_id+'">Member</a></li>\
                                            <li class="uk-nav-divider"></li>\
                                            <li><a id="delete_'+jObjResp.jObjAccount.account_id+'"><i class="material-icons">&#xE872;</i> Delete</a></li>\
                                            <div id="data_'+jObjResp.jObjAccount.account_id+'" style="display: none;">\
                                                {"account_id" : "'+jObjResp.jObjAccount.account_id+'", "account_name" : "'+jObjResp.jObjAccount.account_name+'", "account_email" : "'+jObjResp.jObjAccount.account_email+'"}\
                                            </div>\
                                        </ul>\
                                    </div>\
                                </div>\
                                <div class="md-card-list-item-avatar-wrapper">\
                                    <span class="md-card-list-item-avatar md-bg-light-green">ne</span>\
                                </div>\
                                <div class="md-card-list-item-sender">\
                                    <span>'+jObjResp.jObjAccount.account_name+'</span>\
                                </div>\
                                <div class="md-card-list-item-subject">\
                                    <span>'+jObjResp.jObjAccount.account_email+'\
                                        <div style="float: right;" id="as_'+jObjResp.jObjAccount.account_id+'">As '+jObjResp.jObjAccount.level_name+'</div>\
                                    </span>\
                                </div>\
                            </li>';
                            $('#container_member').append(memberElement);
                            ctrlMember.addMemberActionListener();
                        } else if (jObjResp.rc == '02') {
                            window.location.href = jObjResp.redirectUrl;
                        } else {
                            UIkit.modal.alert(jObjResp.message);
                        }
                    },
                    error: function (e) {
                        console.debug(e);
                        UIkit.modal.alert("Failed update data, network error!");
                    },
                    complete: function (e) {
                        modalLoading.hide();
                    }
                });
            },
            submitAsAdmin: function (dataAccountId) {
                UIkit.modal.confirm('Are you sure set member as Admin for "'+dataAccountId.account_name+'"?', function () {
                    var modalLoading = UIkit.modal.blockUI("On Progress update Member as Admin"); // modal.hide() to unblock
                    $.ajax({
                        url: $("#webRootUrl").html() + 'ControllerMamenMember/setMemberAs',
                        type: 'POST',
                        async: true,
                        cache: false,
                        data: {
                            'account_id': dataAccountId.account_id,
                            'level_id': 2
                        },
                        xhrFields: {
                            withCredentials: true
                        },
                        //milisecond timeout
                        timeout: 0,
                        success: function (jObjRespStr) {
                            ctrlMember.consoleLog(jObjRespStr);
                            jObjResp = JSON.parse(jObjRespStr);
                            if (jObjResp.rc == '00') {
                                $('#as_' + jObjResp.jObjAccount.account_id).html('As ' + jObjResp.jObjAccount.level_name);
                            } else if (jObjResp.rc == '02') {
                                window.location.href = jObjResp.redirectUrl;
                            } else {
                                UIkit.modal.alert(jObjResp.message);
                            }
                        },
                        error: function (e) {
                            console.debug(e);
                            UIkit.modal.alert("Failed update data, network error!");
                        },
                        complete: function (e) {
                            modalLoading.hide();
                        }
                    });
                }, function () {

                });
            },
            submitAsWatcher: function (dataAccountId) {
                UIkit.modal.confirm('Are you sure set member as Watcher for "'+dataAccountId.account_name+'"?', function () {
                    var modalLoading = UIkit.modal.blockUI("On Progress update Member as Watcher"); // modal.hide() to unblock
                    $.ajax({
                        url: $("#webRootUrl").html() + 'ControllerMamenMember/setMemberAs',
                        type: 'POST',
                        async: true,
                        cache: false,
                        data: {
                            'account_id': dataAccountId.account_id,
                            'level_id': 4
                        },
                        xhrFields: {
                            withCredentials: true
                        },
                        //milisecond timeout
                        timeout: 0,
                        success: function (jObjRespStr) {
                            ctrlMember.consoleLog(jObjRespStr);
                            jObjResp = JSON.parse(jObjRespStr);
                            if (jObjResp.rc == '00') {
                                $('#as_' + jObjResp.jObjAccount.account_id).html('As ' + jObjResp.jObjAccount.level_name);
                            } else if (jObjResp.rc == '02') {
                                window.location.href = jObjResp.redirectUrl;
                            } else {
                                UIkit.modal.alert(jObjResp.message);
                            }
                        },
                        error: function (e) {
                            console.debug(e);
                            UIkit.modal.alert("Failed update data, network error!");
                        },
                        complete: function (e) {
                            modalLoading.hide();
                        }
                    });
                }, function () {

                });
            },
            submitAsMember: function (dataAccountId) {
                UIkit.modal.confirm('Are you sure set member as Member for "'+dataAccountId.account_name+'"?', function () {
                    var modalLoading = UIkit.modal.blockUI("On Progress update Member as Member"); // modal.hide() to unblock
                    $.ajax({
                        url: $("#webRootUrl").html() + 'ControllerMamenMember/setMemberAs',
                        type: 'POST',
                        async: true,
                        cache: false,
                        data: {
                            'account_id': dataAccountId.account_id,
                            'level_id': 3
                        },
                        xhrFields: {
                            withCredentials: true
                        },
                        //milisecond timeout
                        timeout: 0,
                        success: function (jObjRespStr) {
                            ctrlMember.consoleLog(jObjRespStr);
                            jObjResp = JSON.parse(jObjRespStr);
                            if (jObjResp.rc == '00') {
                                $('#as_' + jObjResp.jObjAccount.account_id).html('As ' + jObjResp.jObjAccount.level_name);
                            } else if (jObjResp.rc == '02') {
                                window.location.href = jObjResp.redirectUrl;
                            } else {
                                UIkit.modal.alert(jObjResp.message);
                            }
                        },
                        error: function (e) {
                            console.debug(e);
                            UIkit.modal.alert("Failed update data, network error!");
                        },
                        complete: function (e) {
                            modalLoading.hide();
                        }
                    });
                }, function () {

                });
            },
            submitDeleteMember: function (dataAccountId) {
                UIkit.modal.confirm('Are you sure to remove "'+dataAccountId.account_name+'" as your member team?', function () {
                    var modalLoading = UIkit.modal.blockUI("On Progress remove Member"); // modal.hide() to unblock
                    $.ajax({
                        url: $("#webRootUrl").html() + 'ControllerMamenMember/deleteMember',
                        type: 'POST',
                        async: true,
                        cache: false,
                        data: {
                            'account_id': dataAccountId.account_id
                        },
                        xhrFields: {
                            withCredentials: true
                        },
                        //milisecond timeout
                        timeout: 0,
                        success: function (jObjRespStr) {
                            ctrlMember.consoleLog(jObjRespStr);
                            jObjResp = JSON.parse(jObjRespStr);
                            if (jObjResp.rc == '00') {
                                $('#container_' + jObjResp.jObjAccount.account_id).remove();
                            } else if (jObjResp.rc == '02') {
                                window.location.href = jObjResp.redirectUrl;
                            } else {
                                UIkit.modal.alert(jObjResp.message);
                            }
                        },
                        error: function (e) {
                            console.debug(e);
                            UIkit.modal.alert("Failed update data, network error!");
                        },
                        complete: function (e) {
                            modalLoading.hide();
                        }
                    });
                }, function () {

                });
            },
            consoleLog: function (string) {
                console.log(string);
            }
        }
    </script>
</body>

</html>
